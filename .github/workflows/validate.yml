name: Validate prebuilt configuration

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: duckdb-prebuilt-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Config and script validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate pinned versions
        run: python scripts/verify_config.py

      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py

      - name: Validate JSON metadata
        run: python -m json.tool version.json >/dev/null
